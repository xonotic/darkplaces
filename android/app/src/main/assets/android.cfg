// Xonotic Android defaults - rewritten on every launch.
// Put personal overrides in data/autoexec.cfg instead.

// ---- Game controller (SDL GameController / Xbox layout) ----
joy_enable 1
joy_index 0
joy_axiskeyevents 1
joy_sdl2_trigger_deadzone 0.3
joy_x360_deadzoneforward 0.2
joy_x360_deadzoneside 0.2
joy_x360_deadzonepitch 0.15
joy_x360_deadzoneyaw 0.15
joy_x360_sensitivityyaw -2.6
joy_x360_sensitivitypitch -1.8

bind X360_RIGHT_TRIGGER "+fire"
bind X360_LEFT_TRIGGER  "+fire2"
bind X360_A             "+jump"
bind X360_B             "+crouch"
bind X360_X             "+reload"
bind X360_Y             "weaplast"
bind X360_RIGHT_SHOULDER "weapnext"
bind X360_LEFT_SHOULDER  "weapprev"
bind X360_LEFT_THUMB    "+hook"
bind X360_RIGHT_THUMB   "+zoom"
bind X360_DPAD_UP       "+showscores"
bind X360_DPAD_DOWN     "dropweapon"
bind X360_DPAD_LEFT     "messagemode"
bind X360_DPAD_RIGHT    "vyes"
bind X360_BACK          "+showscores"
bind X360_START         "togglemenu"

// ---- Mobile-friendly performance defaults ----
vid_fullscreen 1
r_shadow_realtime_world 0
r_shadow_realtime_dlight_shadows 0
r_bloom 0
r_glsl_postprocess 0
r_water 0
r_depthfirst 0
cl_particles_quality 0.5
gl_texture_anisotropy 1
r_viewscale 0.75
cl_maxfps 60
showfps 1
